<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaShi Jyotish - Kundli & Palm Reading</title>
  <style>
    :root {
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --accent-color: #D4AF37;
      --text-color: #F8FAFC;
      --input-bg: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-card {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-color);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    h2 {
      color: var(--accent-color);
      text-align: center;
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #CBD5E1;
    }

    input[type="text"], input[type="date"] {
      width: 100%;
      padding: 10px;
      background-color: var(--input-bg);
      border: 1px solid #475569;
      border-radius: 8px;
      color: #FFF;
      font-size: 14px;
      box-sizing: border-box;
    }

    /* Instagram Safe Dropdowns Style */
    .time-picker-container {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    select {
      flex: 1;
      padding: 10px;
      background-color: var(--input-bg);
      border: 1px solid #475569;
      border-radius: 8px;
      color: #FFF;
      font-size: 14px;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--accent-color);
      color: #0F172A;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .result-box {
      margin-top: 20px;
      padding: 15px;
      background-color: var(--input-bg);
      border-radius: 8px;
      border-left: 4px solid var(--accent-color);
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <h2>✨ KaShi Jyotish ✨</h2>
    
    <form id="jyotishForm">
      <div class="form-group">
        <label for="fullName">Pura Naam (Full Name):</label>
        <input type="text" id="fullName" placeholder="Apna naam likhein" required>
      </div>

      <div class="form-group">
        <label for="birthDate">Janam Tithi (Date of Birth):</label>
        <input type="date" id="birthDate" required>
      </div>

      <!-- Instagram Safe Time Selector -->
      <div class="form-group">
        <label>Janam Samay (Time of Birth):</label>
        <div class="time-picker-container">
          <select id="birthHour">
            <option value="01">01</option>
            <option value="02">02</option>
            <option value="03">03</option>
            <option value="04">04</option>
            <option value="05">05</option>
            <option value="06">06</option>
            <option value="07">07</option>
            <option value="08">08</option>
            <option value="09">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>

          <span style="color: var(--accent-color); font-weight: bold;">:</span>

          <select id="birthMinute">
            <option value="00">00</option>
            <option value="05">05</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="35">35</option>
            <option value="40">40</option>
            <option value="45">45</option>
            <option value="50">50</option>
            <option value="55">55</option>
          </select>

          <select id="birthAmpm">
            <option value="AM">AM</option>
            <option value="PM">PM</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="birthPlace">Janam Sthan (Place of Birth):</label>
        <input type="text" id="birthPlace" placeholder="City / Town naam" required>
      </div>

      <button type="button" class="btn-submit" onclick="generateReport()">Generate Free Report</button>
    </form>

    <div id="resultBox" class="result-box">
      <h3 style="margin-top:0; color: var(--accent-color);">Aapki Report:</h3>
      <div id="reportContent"></div>
    </div>
  </div>

  <script>
    function generateReport() {
      const name = document.getElementById("fullName").value;
      const dob = document.getElementById("birthDate").value;
      const hour = document.getElementById("birthHour").value;
      const minute = document.getElementById("birthMinute").value;
      const ampm = document.getElementById("birthAmpm").value;
      const place = document.getElementById("birthPlace").value;

      if (!name || !dob || !place) {
        alert("Kripya sabhi details sahi se bharein!");
        return;
      }

      const formattedTime = `${hour}:${minute} ${ampm}`;

      // Date parsing for Rashi calculation
      const birthDateObj = new Date(dob);
      const month = birthDateObj.getMonth() + 1;
      const day = birthDateObj.getDate();

      let rashi = "Mesh (Aries)";
      let luckyColor = "Peela (Yellow) aur Sunehra (Gold)";
      let luckyNumber = "7";

      if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) rashi = "Mesh (Aries)";
      else if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) rashi = "Vrishabh (Taurus)";
      else if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) rashi = "Mithun (Gemini)";
      else if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) rashi = "Kark (Cancer)";
      else if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) rashi = "Singh (Leo)";
      else if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) rashi = "Kanya (Virgo)";
      else if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) rashi = "Tula (Libra)";
      else if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) rashi = "Vrishchik (Scorpio)";
      else if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) rashi = "Dhanu (Sagittarius)";
      else if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) rashi = "Makar (Capricorn)";
      else if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) rashi = "Kumbh (Aquarius)";
      else rashi = "Meen (Pisces)";

      const reportBox = document.getElementById("resultBox");
      const reportContent = document.getElementById("reportContent");

      reportContent.innerHTML = `
        <div style="line-height: 1.6;">
          <p style="margin-top:0;"><strong>🙏 Namaste ${name}!</strong></p>
          
          <p><strong>📌 Birth Details:</strong><br>
          • Date: ${dob}<br>
          • Time: ${formattedTime}<br>
          • Place: ${place}</p>

          <hr style="border:0; border-top: 1px solid #475569; margin: 10px 0;">

          <p><strong>🔮 Astrological Overview:</strong><br>
          • <strong>Rashi (Zodiac):</strong> ${rashi}<br>
          • <strong>Shubh Rang (Lucky Color):</strong> ${luckyColor}<br>
          • <strong>Shubh Ank (Lucky Number):</strong> ${luckyNumber}</p>

          <p>🌟 <strong>Kundli Analysis:</strong> Aapki patrika ke anusar graho ki sthiti vyapar aur karya kshetra me shubh yog bana rahi hai. Sahi disha me kiya gaya prayas safalta dega.</p>

          <hr style="border:0; border-top: 1px solid #475569; margin: 10px 0;">

          <!-- Palm Reading (Hastrekha) Section -->
          <div style="background-color: #0F172A; padding: 12px; border-radius: 8px; border: 1px dashed #D4AF37; margin-top: 12px; text-align: center;">
            <h4 style="margin: 0 0 6px 0; color: #D4AF37;">✋ Palm Reading Analysis (Hastrekha)</h4>
            <p style="font-size: 13px; margin: 0 0 10px 0; color: #CBD5E1;">
              Apni hatheli ki photo bhejkar personal Hastrekha Reading ke liye niche click karein:
            </p>
            <a href="https://ig.me/m/kashicrafts_india" target="_blank" rel="noopener noreferrer" 
               style="background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); 
                      color: #FFF; padding: 10px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; display: inline-block;">
               📩 Send Palm Photo to @kashicrafts_india
            </a>
          </div>
        </div>
      `;

      reportBox.style.display = "block";
    }
  </script>
</body>
</html>
